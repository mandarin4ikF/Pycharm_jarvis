# config/routing.yaml
# Конфигурация маршрутизатора запросов.
# Определяет, какие модели использовать для задач разной сложности.

# Определение моделей для каждой категории сложности.
# Ключ - тег сложности, значение - имя модели в Ollama.
complexity_map:
  simple: "phi3:mini"
  medium: "llama3"
  complex: "llama3:70b"

# Порядок отката (fallback).
fallback_order:
  - simple
  - medium
  - complex

# Настройки классификатора сложности.
classifier:
  # Модель для получения эмбеддингов.
  model_name: "paraphrase-multilingual-MiniLM-L12-v2"

  # Эталонные фразы для определения сложности.
  prototypes:
    simple:
      - "посчитай 2+2"
      - "какая сегодня погода"
      - "переведи привет на английский"
      - "кто такой пушкин"
    medium:
      - "напиши простой python скрипт для парсинга сайта"
      - "составь краткое содержание статьи по ссылке"
      - "объясни концепцию асинхронности в программировании"
      - "сравни два смартфона: iphone 15 и samsung s24"
    complex:
      - "разработай архитектуру для высоконагруженного веб-приложения"
      - "проанализируй этот датасет и найди инсайты"
      - "напиши детальный бизнес-план для стартапа в области ИИ"
      - "создай многопоточного агента для автономного исследования на основе crewai"
